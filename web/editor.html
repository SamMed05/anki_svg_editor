<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anki SVG editor</title>
<style>
  /* ============================================================
     THEME TOKENS
     Light is the default. Dark values apply either automatically
     via prefers-color-scheme, or explicitly when the host page
     sets <html data-theme="dark|light">. The Anki add-on can call
     window.setEditorTheme('dark' | 'light' | 'auto') at any time
     to force a theme that matches Anki's actual night-mode state,
     which is more reliable than the OS color scheme alone.
     ============================================================ */
  :root {
    color-scheme: light dark;

    --bg-app: #f4f6f9;
    --panel: #ffffff;
    --panel-alt: #f8fafc;
    --panel-sunken: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-faint: #94a3b8;

    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #e6edfe;
    --accent-contrast: #ffffff;

    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fdecec;

    --success: #16a34a;

    --hover-halo: 37, 99, 235;
    --select-halo: 220, 38, 38;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --shadow-md: 0 6px 20px -4px rgba(15, 23, 42, .14), 0 2px 6px -2px rgba(15, 23, 42, .08);
    --shadow-lg: 0 20px 44px -12px rgba(15, 23, 42, .28);

    --radius-sm: 6px;
    --radius-md: 9px;
    --radius-lg: 14px;

    --checker-a: #eef1f6;
    --checker-b: #e3e8f0;
    --canvas-surface: #ffffff;
    --canvas-ink: #0f172a;

    --scrollbar: #cbd5e1;
    --scrollbar-hover: #94a3b8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not(.light_mode):not(.lightMode) {
      --bg-app: #1c1d21;
      --panel: #232428;
      --panel-alt: #28292e;
      --panel-sunken: #1c1d21;
      --border: #37383f;
      --border-strong: #4a4b53;
      --text: #e8e9ec;
      --text-muted: #a0a1ab;
      --text-faint: #75767f;

      --accent: #5b9dfa;
      --accent-hover: #79b0fb;
      --accent-soft: #223452;
      --accent-contrast: #0b1220;

      --danger: #f47171;
      --danger-hover: #f68e8e;
      --danger-soft: #3a2224;

      --success: #4ade80;

      --hover-halo: 91, 157, 250;
      --select-halo: 244, 113, 113;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-md: 0 6px 20px -4px rgba(0, 0, 0, .55), 0 2px 6px -2px rgba(0, 0, 0, .4);
      --shadow-lg: 0 20px 44px -12px rgba(0, 0, 0, .6);

      --checker-a: #1a1b1f;
      --checker-b: #212227;
      --canvas-surface: #f8fafc;
      --canvas-ink: #0f172a;

      --scrollbar: #4a4b53;
      --scrollbar-hover: #5c5d66;
    }
  }

  html[data-theme="dark"],
  body[data-theme="dark"],
  html.night_mode,
  body.night_mode,
  html.nightMode,
  body.nightMode,
  .night_mode,
  .nightMode {
    --bg-app: #1c1d21;
    --panel: #232428;
    --panel-alt: #28292e;
    --panel-sunken: #1c1d21;
    --border: #37383f;
    --border-strong: #4a4b53;
    --text: #e8e9ec;
    --text-muted: #a0a1ab;
    --text-faint: #75767f;

    --accent: #5b9dfa;
    --accent-hover: #79b0fb;
    --accent-soft: #223452;
    --accent-contrast: #0b1220;

    --danger: #f47171;
    --danger-hover: #f68e8e;
    --danger-soft: #3a2224;

    --success: #4ade80;

    --hover-halo: 91, 157, 250;
    --select-halo: 244, 113, 113;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-md: 0 6px 20px -4px rgba(0, 0, 0, .55), 0 2px 6px -2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 20px 44px -12px rgba(0, 0, 0, .6);

    --checker-a: #1a1b1f;
    --checker-b: #212227;
    --canvas-surface: #f8fafc;
    --canvas-ink: #0f172a;

    --scrollbar: #4a4b53;
    --scrollbar-hover: #5c5d66;
  }

  html[data-theme="light"],
  body[data-theme="light"],
  html.light_mode,
  body.light_mode,
  html.lightMode,
  body.lightMode {
    --bg-app: #f4f6f9;
    --panel: #ffffff;
    --panel-alt: #f8fafc;
    --panel-sunken: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-faint: #94a3b8;

    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #e6edfe;
    --accent-contrast: #ffffff;

    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fdecec;

    --success: #16a34a;

    --hover-halo: 37, 99, 235;
    --select-halo: 220, 38, 38;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --shadow-md: 0 6px 20px -4px rgba(15, 23, 42, .14), 0 2px 6px -2px rgba(15, 23, 42, .08);
    --shadow-lg: 0 20px 44px -12px rgba(15, 23, 42, .28);

    --checker-a: #eef1f6;
    --checker-b: #e3e8f0;
    --canvas-surface: #ffffff;
    --canvas-ink: #0f172a;

    --scrollbar: #cbd5e1;
    --scrollbar-hover: #94a3b8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    background: var(--bg-app);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); background-clip: content-box; }

  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea {
    background: var(--panel-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    width: 100%;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--border-strong); }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--hover-halo), .18);
  }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  input[type="color"] {
    padding: 2px;
    width: 34px;
    height: 30px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  select { cursor: pointer; }

  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 7px 11px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
  }
  button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--panel-alt); }
  button:active:not(:disabled) { transform: translateY(0.5px); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

  button.danger { color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); border-color: var(--danger); }

  button.subtle { border-color: transparent; background: transparent; }
  button.subtle:hover:not(:disabled) { background: var(--panel-alt); border-color: var(--border); }

  button.icon-only { padding: 7px; width: 32px; height: 32px; }

  .icon { width: 14px; height: 14px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  .title-group { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
  .title-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent); color: var(--accent-contrast);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .title-mark .icon { width: 15px; height: 15px; }
  .title-text { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar-group { display: flex; align-items: center; gap: 6px; }
  .toolbar-divider { width: 1px; align-self: stretch; margin: 2px 2px; background: var(--border); }
  .shortcut { color: var(--text-faint); font-size: 10.5px; margin-left: 2px; }

  .zoom-pill {
    display: flex; align-items: center; gap: 2px;
    background: var(--panel-sunken); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 4px;
  }
  .zoom-pill button { border: 0; background: transparent; border-radius: 999px; padding: 4px 7px; height: auto; }
  .zoom-pill button:hover:not(:disabled) { background: var(--panel); }
  .zoom-readout { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-muted); min-width: 36px; text-align: center; }

  /* ---------- Layout ---------- */
  .layout { display: flex; min-height: 0; flex: 1; }

  .canvas-wrap {
    flex: 1;
    overflow: auto;
    background-color: var(--checker-a);
    background-image:
      linear-gradient(45deg, var(--checker-b) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker-b) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker-b) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker-b) 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    padding: 34px;
  }

  .canvas {
    min-width: 420px;
    min-height: 300px;
    width: max-content;
    max-width: 100%;
    margin: auto;
    background: var(--canvas-surface);
    color: var(--canvas-ink);
    border-radius: var(--radius-lg);
    padding: 26px;
    box-shadow: var(--shadow-lg);
    transform-origin: top left;
  }

  .canvas svg {
    max-width: 100%;
    height: auto;
    overflow: visible;
    display: block;
    transition: outline .15s ease;
  }
  .canvas svg:not(.icon):hover {
    outline: 1.5px dashed var(--accent);
    outline-offset: 2px;
  }

  /* Hover Copy Button for SVGs */
  .svg-wrapper {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  .svg-copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    opacity: 0;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 5px;
    cursor: pointer;
    z-index: 10;
    box-shadow: var(--shadow-sm);
    transition: opacity .15s ease, background .12s ease;
  }
  .svg-wrapper:hover .svg-copy-btn {
    opacity: 0.65;
    pointer-events: auto;
  }
  .svg-wrapper:hover .svg-copy-btn:hover {
    opacity: 1;
    background: var(--panel-alt);
    border-color: var(--border-strong);
  }

  /* Editable element affordances */
  .editable { cursor: pointer; }
  .editable:hover { filter: drop-shadow(0 0 4px rgba(var(--hover-halo), .85)); }
  .selected { filter: drop-shadow(0 0 5px rgba(var(--select-halo), .95)); }
  .hit { pointer-events: stroke; stroke: transparent; stroke-width: 18px; fill: none; cursor: pointer; marker-start: none !important; marker-end: none !important;}

  .editor-overlay .handle { cursor: grab; }
  .editor-overlay .handle:active { cursor: grabbing; }
  .editor-overlay .handle-anchor { fill: #2563eb; stroke: #fff; stroke-width: 1.4; }
  .editor-overlay .handle-ctrl { fill: #ea580c; stroke: #fff; stroke-width: 1.4; }
  .editor-overlay .handle-ctrl2 { fill: #0d9488; stroke: #fff; stroke-width: 1.4; }
  .editor-overlay .handle-start { fill: #16a34a; stroke: #fff; stroke-width: 1.4; }
  .editor-overlay .handle-end { fill: #dc2626; stroke: #fff; stroke-width: 1.4; }
  .editor-overlay .guide { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 3; opacity: .8; }

  /* ---------- Inspector ---------- */
  .inspector {
    width: 292px;
    flex: 0 0 auto;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  .inspector-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px 15px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel); z-index: 2;
  }
  .inspector-head h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-muted); margin: 0; font-weight: 650;
  }
  .badge {
    display: inline-flex; align-items: center; max-width: 150px;
    padding: 3px 8px; background: var(--panel-sunken); border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 999px; font-size: 10.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge.active { color: var(--accent); border-color: rgba(var(--hover-halo), .35); background: var(--accent-soft); }

  .inspector-body { padding: 14px 15px 26px; flex: 1; }

  .empty-state { text-align: center; padding: 44px 14px; color: var(--text-muted); }
  .empty-state .icon { width: 30px; height: 30px; margin-bottom: 10px; color: var(--text-faint); }
  .empty-state p { margin: 0; line-height: 1.55; font-size: 12.5px; }

  .section {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 12px;
  }
  .section h3 {
    margin: 0 0 10px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted); font-weight: 650;
  }

  .field { margin: 10px 0; }
  .field:first-child { margin-top: 0; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 11px; color: var(--text-muted); margin-bottom: 5px;
  }
  .field label .value-echo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: var(--text-faint); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .grid2 .field { margin: 0; }

  .color-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .color-row input[type="text"] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .swatch {
    width: 100%; aspect-ratio: 1; padding: 0; border-radius: 6px;
    border: 1px solid var(--border-strong); position: relative;
  }
  .swatch[data-selected="1"]::after {
    content: ""; position: absolute; inset: -3px; border-radius: 999px;
    border: 2px solid var(--accent);
  }
  .swatch.swatch-auto { background: repeating-linear-gradient(45deg, #b8c0cc, #b8c0cc 3px, #dfe4ea 3px, #dfe4ea 6px); }
  .swatch.swatch-none { background: var(--panel); }
  .swatch.swatch-none::before {
    content: ""; position: absolute; inset: 4px; border-top: 1.5px solid #ef4444;
    transform: rotate(45deg); transform-origin: center;
  }

  .stepper-row { display: flex; align-items: center; gap: 8px; }
  .stepper-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .stepper-readout {
    min-width: 40px; text-align: right; font-variant-numeric: tabular-nums;
    font-size: 11px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row button { flex: 1; }

  .notice { color: var(--text-faint); font-size: 10.5px; line-height: 1.5; padding-top: 4px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .5);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 50; backdrop-filter: blur(2px);
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    width: 100%; max-width: 560px; max-height: 86vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid var(--border);
  }
  .modal-head strong { font-size: 13px; font-weight: 650; }
  .modal-body { padding: 16px; overflow-y: auto; }
  .modal-body textarea {
    width: 100%; height: 260px; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.55;
  }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel-alt); }

  /* ---------- Toasts ---------- */
  .toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
  .toast {
    pointer-events: auto; background: var(--text); color: var(--bg-app);
    padding: 9px 13px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
    box-shadow: var(--shadow-md); opacity: 0; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease;
    display: flex; align-items: center; gap: 8px; max-width: 280px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); color: #fff; }

  @media (max-width: 780px) {
    .layout { flex-direction: column; }
    .inspector { width: auto; border-left: 0; border-top: 1px solid var(--border); max-height: 46vh; }
    .canvas-wrap { padding: 16px; }
    .canvas { min-width: 0; width: 100%; padding: 18px; }
    .toolbar { gap: 6px; }
    .title-text { display: none; }
    .shortcut { display: none; }
  }
</style>
</head>

<body>
  <div class="toolbar">
    <div class="title-group">
      <span class="title-mark">
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" style="max-width: 24px;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8L2 12l4 4" />
          <path d="M18 8l4 4-4 4" />
          <path d="M14.5 4.5l-5 15" stroke-dasharray="2 2" stroke-width="1.5" />
          <rect x="13" y="3.5" width="3" height="3" fill="currentColor" />
          <rect x="8" y="17.5" width="3" height="3" fill="currentColor" />
        </svg>
      </span>
      <span class="title-text">SVG field editor</span>
    </div>
    <div class="toolbar-group">
      <button id="btnImport" class="subtle" title="Import raw SVG or HTML">
        <svg class="icon" viewBox="0 0 24 24"><path d="M8 4 3 12l5 8" /><path d="M16 4l5 8-5 8" /></svg>
        Import
      </button>
      <button id="btnCopy" class="subtle" title="Copy the current code">
        <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>
        Copy all
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button id="undo" class="icon-only" disabled title="Undo (Ctrl+Z)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7v6h6" /><path d="M21 17a9 9 0 0 0-15-6.7L3 13" /></svg>
      </button>
      <button id="redo" class="icon-only" disabled title="Redo (Ctrl+Y)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 7v6h-6" /><path d="M3 17a9 9 0 0 1 15-6.7L21 13" /></svg>
      </button>
      <span class="shortcut">Ctrl+Z / Ctrl+Y</span>
    </div>
    <div class="toolbar-divider"></div>
    <div class="zoom-pill">
      <button id="zoomOut" title="Zoom out">−</button>
      <span id="zoomReadout" class="zoom-readout">100%</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <div class="toolbar-divider" style="height:16px;align-self:center;"></div>
      <button id="zoomReset" title="Reset zoom">Reset</button>
    </div>
  </div>

  <div class="layout">
    <main class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
    </main>
    <aside class="inspector">
      <div class="inspector-head">
        <h2>Inspector</h2>
        <span id="badge" class="badge">No selection</span>
      </div>
      <div class="inspector-body">
        <div id="empty" class="empty-state">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 4l7 17 2-7 7-2z" /></svg>
          <p>Select a node, label, line, curve, or rectangle in the diagram to edit it here.</p>
        </div>

        <div id="controls" hidden>
          <!-- Appearance -->
          <div class="section">
            <h3>Appearance</h3>

            <div id="fillRow">
              <div class="field"><label>Fill <span id="fillEcho" class="value-echo"></span></label></div>
              <div class="swatches" id="fillSwatches"></div>
              <div class="color-row">
                <input id="fillPicker" type="color" value="#2563eb">
                <input id="fillHex" type="text" placeholder="currentColor, #hex, none">
              </div>
            </div>

            <div id="strokeRow" style="margin-top:14px;">
              <div class="field"><label>Stroke <span id="strokeEcho" class="value-echo"></span></label></div>
              <div class="swatches" id="strokeSwatches"></div>
              <div class="color-row">
                <input id="strokePicker" type="color" value="#2563eb">
                <input id="strokeHex" type="text" placeholder="currentColor, #hex, none">
              </div>
            </div>

            <div id="strokeWidthRow" style="margin-top:14px;">
              <div class="field"><label>Stroke width</label></div>
              <div class="stepper-row">
                <input id="strokeWidthRange" type="range" min="0.5" max="14" step="0.5">
                <span id="strokeWidthReadout" class="stepper-readout">2.0</span>
              </div>
            </div>
          </div>

          <!-- Text panel -->
          <section id="panelText" class="section" hidden>
            <h3>Text</h3>
            <div class="field"><label>Content</label><input id="textContent" type="text"></div>
            <div class="grid2">
              <div class="field"><label>X</label><input id="textX" type="number"></div>
              <div class="field"><label>Y</label><input id="textY" type="number"></div>
            </div>
            <div class="grid2">
              <div class="field"><label>Font size</label><input id="textSize" type="number" min="1"></div>
              <div class="field"><label>Anchor</label>
                <select id="textAnchor">
                  <option value="start">Start</option>
                  <option value="middle">Middle</option>
                  <option value="end">End</option>
                </select>
              </div>
            </div>
          </section>

          <!-- Node panel -->
          <section id="panelNode" class="section" hidden>
            <h3>Node</h3>
            <div class="field"><label>Label</label><input id="nodeLabel" type="text"></div>
            <div class="grid2">
              <div class="field"><label>Center X</label><input id="nodeCx" type="number"></div>
              <div class="field"><label>Center Y</label><input id="nodeCy" type="number"></div>
            </div>
          </section>

          <!-- Rect panel -->
          <section id="panelRect" class="section" hidden>
            <h3>Rectangle</h3>
            <div class="grid2">
              <div class="field"><label>X</label><input id="rectX" type="number"></div>
              <div class="field"><label>Y</label><input id="rectY" type="number"></div>
            </div>
            <div class="grid2">
              <div class="field"><label>Width</label><input id="rectW" type="number" min="0"></div>
              <div class="field"><label>Height</label><input id="rectH" type="number" min="0"></div>
            </div>
          </section>

          <!-- Edge panel -->
          <section id="panelEdge" class="section" hidden>
            <h3>Edge</h3>
            <div class="grid2">
              <div class="field"><label>Start cap</label>
                <select id="markerStart">
                  <option value="none">None</option>
                  <option value="arrow">Arrow</option>
                  <option value="circle">Circle</option>
                  <option value="square">Square</option>
                </select>
              </div>
              <div class="field"><label>End cap</label>
                <select id="markerEnd">
                  <option value="none">None</option>
                  <option value="arrow">Arrow</option>
                  <option value="circle">Circle</option>
                  <option value="square">Square</option>
                </select>
              </div>
            </div>
            <div class="btn-row">
              <button id="btnFlip" class="btn-block">
                <svg class="icon" viewBox="0 0 24 24"><path d="M7 7h11l-3-3" /><path d="M17 17H6l3 3" /></svg>
                Reverse
              </button>
              <button id="btnConvert" class="btn-block">
                <svg id="btnConvertIcon" class="icon" viewBox="0 0 24 24"><path d="M3 17c4 0 4-10 8-10s4 10 8 10" /></svg>
                <span id="btnConvertLabel">Curve</span>
              </button>
            </div>
            <p class="notice" style="margin-top:10px;">Drag the coloured handles on the diagram to reshape a curve or move an endpoint.</p>
          </section>

          <button id="delete" class="danger btn-block" disabled title="Delete selected element (Del)" style="margin-top:14px;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /></svg>
            Delete element
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Import modal -->
  <div id="importModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <strong>Import SVG / HTML code</strong>
        <button id="importClose" class="icon-only subtle" title="Close">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12" /><path d="M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="modal-body">
        <textarea id="importArea" spellcheck="false" placeholder="Paste an <svg>...</svg> or full HTML snippet here"></textarea>
      </div>
      <div class="modal-foot">
        <button id="importCancel">Cancel</button>
        <button id="importApply" class="primary">Apply</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script>
    (function () {
      'use strict';

      const initialHtml = typeof __INITIAL_HTML__ !== 'undefined' 
        ? __INITIAL_HTML__ 
        : '<svg viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="40" fill="currentColor" /></svg>';
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const $ = (id) => document.getElementById(id);
      const canvas = $('canvas');

      const SWATCHES = [
        { v: 'currentColor', label: 'Auto', cls: 'swatch-auto' },
        { v: 'none', label: 'None', cls: 'swatch-none' },
        { v: '#64748b', label: 'Slate' },
        { v: '#dc2626', label: 'Red' },
        { v: '#2563eb', label: 'Blue' },
        { v: '#16a34a', label: 'Green' },
        { v: '#ea580c', label: 'Orange' },
        { v: '#0d9488', label: 'Teal' },
      ];

      // ---- state ----
      let history = [];
      let histIndex = -1;
      let zoom = 1;
      let selection = null;   // { type: 'node'|'text'|'rect'|'line'|'path', el, textEl? }
      let activeSvg = null;
      let overlayGroup = null;
      const hitMap = new WeakMap(); // real line/path element -> invisible wide hit-target twin

      // ============================================================
      // Small helpers
      // ============================================================
      function numAttr(el, name, fallback) {
        const v = parseFloat(el.getAttribute(name));
        return Number.isFinite(v) ? v : (fallback || 0);
      }
      function svgPoint(e, svg) {
        const p = svg.createSVGPoint();
        p.x = e.clientX;
        p.y = e.clientY;
        const m = svg.getScreenCTM();
        return m ? p.matrixTransform(m.inverse()) : { x: p.x, y: p.y };
      }
      function isHexColor(v) {
        return typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim());
      }
      function round(n) { return Math.round(n * 10) / 10; }

      // ============================================================
      // Toasts
      // ============================================================
      function toast(msg, type) {
        const host = $('toasts');
        const el = document.createElement('div');
        el.className = 'toast' + (type === 'error' ? ' error' : '');
        el.textContent = msg;
        host.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => el.remove(), 200);
        }, 2000);
      }

      // ============================================================
      // History
      // ============================================================
      function clean() {
        const clone = canvas.cloneNode(true);
        clone.querySelectorAll('.hit, .editor-overlay, .svg-copy-btn').forEach((e) => e.remove());
        clone.querySelectorAll('.svg-wrapper').forEach((w) => {
          while (w.firstChild) w.parentNode.insertBefore(w.firstChild, w);
          w.remove();
        });
        clone.querySelectorAll('[class]').forEach((e) => {
          e.classList.remove('editable', 'selected');
          if (!e.getAttribute('class')) e.removeAttribute('class');
        });
        return clone.innerHTML.trim();
      }

      function snapshot() {
        const html = clean();
        if (history[histIndex] === html) return;
        history.splice(histIndex + 1);
        history.push(html);
        histIndex++;
        if (history.length > 50) { history.shift(); histIndex--; }
        updateHistoryButtons();
      }

      function updateHistoryButtons() {
        $('undo').disabled = histIndex <= 0;
        $('redo').disabled = histIndex >= history.length - 1;
      }

      function restore(i) {
        if (i < 0 || i >= history.length) return;
        histIndex = i;
        renderHtml(history[histIndex], false);
        updateHistoryButtons();
      }

      // ============================================================
      // Rendering / element wiring
      // ============================================================
      function renderHtml(html, saveHistory) {
        canvas.innerHTML = html;
        canvas.querySelectorAll('svg').forEach(prepareSvg);
        clearSelection();
        if (saveHistory !== false) snapshot();
      }

      function ensureMarkerDefs(svg) {
        let defs = svg.querySelector('defs');
        if (!defs) {
          defs = document.createElementNS(SVG_NS, 'defs');
          svg.insertBefore(defs, svg.firstChild);
        }
        const specs = [
          { id: 'ed-arrow-end', kind: 'path', d: 'M0,0 L8,4 L0,8 Z', refX: 7, refY: 4 },
          { id: 'ed-arrow-start', kind: 'path', d: 'M8,0 L0,4 L8,8 Z', refX: 1, refY: 4 },
          { id: 'ed-circle', kind: 'circle', refX: 4, refY: 4 },
          { id: 'ed-square', kind: 'path', d: 'M1,1 H7 V7 H1 Z', refX: 4, refY: 4 },
        ];
        specs.forEach((s) => {
          if (defs.querySelector('#' + s.id)) return;
          const marker = document.createElementNS(SVG_NS, 'marker');
          marker.setAttribute('id', s.id);
          marker.setAttribute('viewBox', '0 0 8 8');
          marker.setAttribute('refX', s.refX);
          marker.setAttribute('refY', s.refY);
          marker.setAttribute('markerWidth', 7);
          marker.setAttribute('markerHeight', 7);
          marker.setAttribute('orient', 'auto');
          marker.setAttribute('markerUnits', 'strokeWidth');
          let shape;
          if (s.kind === 'circle') {
            shape = document.createElementNS(SVG_NS, 'circle');
            shape.setAttribute('cx', 4);
            shape.setAttribute('cy', 4);
            shape.setAttribute('r', 3);
          } else {
            shape = document.createElementNS(SVG_NS, 'path');
            shape.setAttribute('d', s.d);
          }
          shape.setAttribute('fill', 'context-stroke');
          marker.appendChild(shape);
          defs.appendChild(marker);
        });
      }

      function makeHitTwin(el) {
        const hit = document.createElementNS(SVG_NS, el.tagName);
        hit.classList.add('hit');
        syncHitGeometry(el, hit);
        return hit;
      }
      function syncHitGeometry(el, hit) {
        if (el.tagName === 'line') {
          ['x1', 'y1', 'x2', 'y2'].forEach((a) => hit.setAttribute(a, el.getAttribute(a)));
        } else {
          hit.setAttribute('d', el.getAttribute('d') || '');
        }
      }

      function prepareSvg(svg) {
        // Ignore internal icon SVGs inside buttons
        if (svg.classList.contains('icon') || svg.closest('.svg-copy-btn')) return;

        if (svg.parentNode && !svg.parentNode.classList.contains('svg-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.className = 'svg-wrapper';
          svg.parentNode.insertBefore(wrapper, svg);
          wrapper.appendChild(svg);

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'svg-copy-btn';
          btn.title = 'Copy SVG code';
          btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>';

          // Stop canvas drag & selection handlers from swallowing the click
          btn.addEventListener('pointerdown', (e) => e.stopPropagation());
          btn.addEventListener('mousedown', (e) => e.stopPropagation());

          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const clone = svg.cloneNode(true);
            clone.querySelectorAll('.hit, .editor-overlay').forEach((el) => el.remove());
            clone.querySelectorAll('[class]').forEach((el) => {
              el.classList.remove('editable', 'selected');
              if (!el.getAttribute('class')) el.removeAttribute('class');
            });

            copyToClipboard(clone.outerHTML.trim(), 'SVG code copied to clipboard');
          });

          wrapper.appendChild(btn);
        }

        ensureMarkerDefs(svg);

        svg.querySelectorAll('circle, ellipse').forEach((el) => {
          if (el.closest('defs')) return;
          el.classList.add('editable');
          el.addEventListener('pointerdown', (e) => onNodeDown(e, el, svg));
        });

        svg.querySelectorAll('rect').forEach((el) => {
          if (el.closest('defs')) return;
          el.classList.add('editable');
          el.addEventListener('pointerdown', (e) => onRectDown(e, el, svg));
        });

        svg.querySelectorAll('text').forEach((el) => {
          if (el.closest('defs')) return;
          el.classList.add('editable');
          el.addEventListener('pointerdown', (e) => onTextDown(e, el, svg));
        });

        svg.querySelectorAll('line, path').forEach((el) => {
          if (el.closest('defs') || el.classList.contains('hit')) return;
          el.classList.add('editable');
          const hit = makeHitTwin(el);
          el.parentNode.insertBefore(hit, el);
          hitMap.set(el, hit);
          const onDown = (e) => onEdgeDown(e, el, svg);
          hit.addEventListener('pointerdown', onDown);
          el.addEventListener('pointerdown', onDown);
        });

        svg.addEventListener('pointerdown', (e) => {
          if (e.target === svg) clearSelection();
        });
      }

      function findPairedText(svg, circle) {
        const cx = numAttr(circle, 'cx'), cy = numAttr(circle, 'cy');
        let best = null, bestDist = 11;
        svg.querySelectorAll('text').forEach((t) => {
          const d = Math.hypot(numAttr(t, 'x') - cx, numAttr(t, 'y') - cy);
          if (d < bestDist) { bestDist = d; best = t; }
        });
        return best;
      }

      // ============================================================
      // Selection
      // ============================================================
      function clearSelection() {
        if (selection) {
          selection.el.classList.remove('selected');
          if (selection.textEl) selection.textEl.classList.remove('selected');
        }
        selection = null;
        activeSvg = null;
        removeOverlay();
        $('empty').hidden = false;
        $('controls').hidden = true;
        $('delete').disabled = true;
        $('badge').textContent = 'No selection';
        $('badge').classList.remove('active');
      }

      function setSelection(type, el, extra) {
        clearSelection();
        selection = Object.assign({ type, el }, extra || {});
        activeSvg = closestSvg(el);
        el.classList.add('selected');
        if (selection.textEl) selection.textEl.classList.add('selected');

        $('empty').hidden = true;
        $('controls').hidden = false;
        $('delete').disabled = false;
        $('badge').classList.add('active');
        $('badge').textContent = badgeLabel();

        showPanelsFor(type);
        fillFields();
        renderOverlay();
      }

      function closestSvg(el) {
        let n = el;
        while (n && n.tagName !== 'svg') n = n.parentNode;
        return n;
      }

      function badgeLabel() {
        if (!selection) return 'No selection';
        switch (selection.type) {
          case 'node': return 'Node' + (selection.textEl ? ' \u201c' + selection.textEl.textContent.trim() + '\u201d' : '');
          case 'text': return 'Text \u201c' + selection.el.textContent.trim() + '\u201d';
          case 'rect': return 'Rectangle';
          case 'line': return 'Line';
          case 'path': return isPathStraight(selection.el) ? 'Straight path' : 'Curved path';
          default: return 'Element';
        }
      }

      function showPanelsFor(type) {
        $('panelText').hidden = type !== 'text';
        $('panelNode').hidden = type !== 'node';
        $('panelRect').hidden = type !== 'rect';
        $('panelEdge').hidden = !(type === 'line' || type === 'path');

        $('fillRow').hidden = !(type === 'node' || type === 'rect' || type === 'text');
        $('strokeRow').hidden = type === 'text';
        $('strokeWidthRow').hidden = type === 'text';

        $('fillEcho').closest('label').parentElement.querySelector('label').firstChild.textContent =
          (type === 'text') ? 'Color ' : 'Fill ';
      }

      // ============================================================
      // Field population
      // ============================================================
      function val(id, v) { $(id).value = (v === null || v === undefined) ? '' : v; }

      function fillFields() {
        if (!selection) return;
        const el = selection.el;
        const type = selection.type;

        if (type === 'text' || type === 'node' || type === 'rect') {
          const fillVal = el.getAttribute('fill') || (type === 'text' ? 'currentColor' : 'none');
          setColorControl('fill', fillVal);
        }
        if (type !== 'text') {
          const strokeVal = el.getAttribute('stroke') || 'currentColor';
          setColorControl('stroke', strokeVal);
          const sw = parseFloat(el.getAttribute('stroke-width'));
          const swv = Number.isFinite(sw) ? sw : 2;
          $('strokeWidthRange').value = swv;
          $('strokeWidthReadout').textContent = swv.toFixed(1);
        }

        if (type === 'text') {
          val('textContent', el.textContent);
          val('textX', el.getAttribute('x'));
          val('textY', el.getAttribute('y'));
          val('textSize', el.getAttribute('font-size') || 16);
          $('textAnchor').value = el.getAttribute('text-anchor') || 'start';
        }

        if (type === 'node') {
          val('nodeLabel', selection.textEl ? selection.textEl.textContent : '');
          val('nodeCx', el.getAttribute('cx'));
          val('nodeCy', el.getAttribute('cy'));
        }

        if (type === 'rect') {
          val('rectX', el.getAttribute('x') || 0);
          val('rectY', el.getAttribute('y') || 0);
          val('rectW', el.getAttribute('width') || 0);
          val('rectH', el.getAttribute('height') || 0);
        }

        if (type === 'line' || type === 'path') {
          populateMarkerDropdowns(activeSvg);

          const ms = el.getAttribute('marker-start');
          const me = el.getAttribute('marker-end');

          $('markerStart').value = ms || 'none';
          $('markerEnd').value = me || 'none';

          const straight = type === 'line' || isPathStraight(el);
          $('btnConvertLabel').textContent = straight ? 'Curve' : 'Straighten';
          $('btnConvertIcon').innerHTML = straight
            ? '<path d="M3 17c4 0 4-10 8-10s4 10 8 10"/>'
            : '<path d="M4 12h16"/>';
          $('badge').textContent = badgeLabel();
        }
      }

      function setColorControl(kind, value) {
        $(kind + 'Echo').textContent = value;
        const hexEl = $(kind + 'Hex');
        hexEl.value = value;
        const pickEl = $(kind + 'Picker');
        if (isHexColor(value)) pickEl.value = normalizeHex(value);
        document.querySelectorAll('#' + kind + 'Swatches .swatch').forEach((b) => {
          b.toggleAttribute('data-selected', b.dataset.color === value);
        });
      }
      function normalizeHex(v) {
        if (/^#([0-9a-f]{3})$/i.test(v)) {
          return '#' + v.slice(1).split('').map((c) => c + c).join('');
        }
        return v;
      }

      function buildSwatches() {
        ['fill', 'stroke'].forEach((kind) => {
          const host = $(kind + 'Swatches');
          host.innerHTML = '';
          SWATCHES.forEach((s) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'swatch' + (s.cls ? ' ' + s.cls : '');
            b.title = s.label;
            b.dataset.color = s.v;
            if (!s.cls) b.style.background = s.v;
            b.addEventListener('click', () => applyColor(kind, s.v));
            host.appendChild(b);
          });
        });
      }

      function applyColor(kind, value) {
        if (!selection || !value) return;
        selection.el.setAttribute(kind, value);
        fillFields();
        snapshot();
      }

      // ============================================================
      // Change application (generic “commit after edit” helper)
      // ============================================================
      function change(fn) {
        if (!selection) return;
        fn();
        fillFields();
        snapshot();
      }
      function numVal(id) {
        const n = parseFloat($(id).value);
        return Number.isFinite(n) ? n : 0;
      }

      // ============================================================
      // Pointer-based dragging (mouse, touch, pen — unified)
      // ============================================================
      function beginDrag(e, svg, onMove, onEnd) {
        e.preventDefault();
        e.stopPropagation();
        const start = svgPoint(e, svg);

        function move(ev) {
          const current = svgPoint(ev, svg);
          const dx = current.x - start.x;
          const dy = current.y - start.y;
          onMove(dx, dy);
        }

        function up() {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
          if (onEnd) onEnd();
        }

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
      }

      function onNodeDown(e, circle, svg) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        const text = findPairedText(svg, circle);
        setSelection('node', circle, { textEl: text });

        const baseCx = numAttr(circle, 'cx'), baseCy = numAttr(circle, 'cy');
        const baseTx = text ? numAttr(text, 'x') : baseCx;
        const baseTy = text ? numAttr(text, 'y') : baseCy;

        const attached = [];
        svg.querySelectorAll('line').forEach((line) => {
          const x1 = numAttr(line, 'x1'), y1 = numAttr(line, 'y1');
          const x2 = numAttr(line, 'x2'), y2 = numAttr(line, 'y2');
          if (Math.hypot(x1 - baseCx, y1 - baseCy) < 34) attached.push({ line, end: 1, x: x1, y: y1 });
          if (Math.hypot(x2 - baseCx, y2 - baseCy) < 34) attached.push({ line, end: 2, x: x2, y: y2 });
        });

        beginDrag(e, svg, (dx, dy) => {
          const nx = Math.round(baseCx + dx), ny = Math.round(baseCy + dy);
          circle.setAttribute('cx', nx);
          circle.setAttribute('cy', ny);
          if (text) {
            text.setAttribute('x', Math.round(baseTx + dx));
            text.setAttribute('y', Math.round(baseTy + dy));
          }
          attached.forEach((a) => {
            const lx = Math.round(a.x + dx), ly = Math.round(a.y + dy);
            a.line.setAttribute(a.end === 1 ? 'x1' : 'x2', lx);
            a.line.setAttribute(a.end === 1 ? 'y1' : 'y2', ly);
            const hit = hitMap.get(a.line);
            if (hit) syncHitGeometry(a.line, hit);
          });
          fillFields();
          renderOverlay();
        }, snapshot);
      }

      function onTextDown(e, el, svg) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        setSelection('text', el);
        const baseX = numAttr(el, 'x'), baseY = numAttr(el, 'y');
        beginDrag(e, svg, (dx, dy) => {
          el.setAttribute('x', Math.round(baseX + dx));
          el.setAttribute('y', Math.round(baseY + dy));
          fillFields();
        }, snapshot);
      }

      function onRectDown(e, el, svg) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        setSelection('rect', el);
        const baseX = numAttr(el, 'x'), baseY = numAttr(el, 'y');
        beginDrag(e, svg, (dx, dy) => {
          el.setAttribute('x', Math.round(baseX + dx));
          el.setAttribute('y', Math.round(baseY + dy));
          fillFields();
        }, snapshot);
      }

      function onEdgeDown(e, el, svg) {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        setSelection(el.tagName.toLowerCase(), el);

        if (el.tagName === 'line') {
          const baseLine = {
            x1: numAttr(el, 'x1'), y1: numAttr(el, 'y1'),
            x2: numAttr(el, 'x2'), y2: numAttr(el, 'y2')
          };

          beginDrag(e, svg, (dx, dy) => {
            el.setAttribute('x1', Math.round(baseLine.x1 + dx));
            el.setAttribute('y1', Math.round(baseLine.y1 + dy));
            el.setAttribute('x2', Math.round(baseLine.x2 + dx));
            el.setAttribute('y2', Math.round(baseLine.y2 + dy));
            
            const hit = hitMap.get(el);
            if (hit) syncHitGeometry(el, hit);

            fillFields();
            renderOverlay();
          }, snapshot);

        } else if (el.tagName === 'path') {
          const baseCmds = parsePathCommands(el.getAttribute('d'));

          beginDrag(e, svg, (dx, dy) => {
            const movedCmds = baseCmds.map(cmd => ({
              type: cmd.type,
              args: cmd.args.map((val, idx) => Math.round(val + (idx % 2 === 0 ? dx : dy)))
            }));

            const d = stringifyPathCommands(movedCmds);
            el.setAttribute('d', d);

            const hit = hitMap.get(el);
            if (hit) hit.setAttribute('d', d);

            fillFields();
            renderOverlay();
          }, snapshot);
        }
      }

      // ============================================================
      // Path command parsing (for curve handles, straighten/curve, reverse)
      // ============================================================
      function parsePathCommands(d) {
        if (!d) return [];
        const cmdRegEx = /([a-zA-Z])([^a-zA-Z]*)/g;
        const numRegEx = /-?\d*\.?\d+(?:e[-+]?\d+)?/gi;
        const rawCmds = [];
        let m;
        while ((m = cmdRegEx.exec(d)) !== null) {
          const type = m[1];
          const args = (m[2].match(numRegEx) || []).map(Number);
          rawCmds.push({ type, args });
        }

        const absCmds = [];
        let cx = 0, cy = 0, startX = 0, startY = 0;
        let lastControl = null;

        rawCmds.forEach((cmd) => {
          let t = cmd.type;
          let a = [...cmd.args];
          let isRel = (t === t.toLowerCase() && t !== t.toUpperCase());
          let typeUpper = t.toUpperCase();

          if (typeUpper === 'M') {
            if (isRel) { cx += a[0]; cy += a[1]; } else { cx = a[0]; cy = a[1]; }
            startX = cx; startY = cy;
            absCmds.push({ type: 'M', args: [cx, cy] });
            for (let i = 2; i < a.length; i += 2) {
              if (isRel) { cx += a[i]; cy += a[i+1]; } else { cx = a[i]; cy = a[i+1]; }
              absCmds.push({ type: 'L', args: [cx, cy] });
            }
            lastControl = null;
          } else if (typeUpper === 'L') {
            for (let i = 0; i < a.length; i += 2) {
              if (isRel) { cx += a[i]; cy += a[i+1]; } else { cx = a[i]; cy = a[i+1]; }
              absCmds.push({ type: 'L', args: [cx, cy] });
            }
            lastControl = null;
          } else if (typeUpper === 'H') {
            for (let i = 0; i < a.length; i++) {
              cx = isRel ? cx + a[i] : a[i];
              absCmds.push({ type: 'L', args: [cx, cy] });
            }
            lastControl = null;
          } else if (typeUpper === 'V') {
            for (let i = 0; i < a.length; i++) {
              cy = isRel ? cy + a[i] : a[i];
              absCmds.push({ type: 'L', args: [cx, cy] });
            }
            lastControl = null;
          } else if (typeUpper === 'Q') {
            for (let i = 0; i < a.length; i += 4) {
              let qcx = isRel ? cx + a[i] : a[i];
              let qcy = isRel ? cy + a[i+1] : a[i+1];
              cx = isRel ? cx + a[i+2] : a[i+2];
              cy = isRel ? cy + a[i+3] : a[i+3];
              absCmds.push({ type: 'Q', args: [qcx, qcy, cx, cy] });
              lastControl = [qcx, qcy];
            }
          } else if (typeUpper === 'T') {
            for (let i = 0; i < a.length; i += 2) {
              let qcx = lastControl ? (2 * cx - lastControl[0]) : cx;
              let qcy = lastControl ? (2 * cy - lastControl[1]) : cy;
              cx = isRel ? cx + a[i] : a[i];
              cy = isRel ? cy + a[i+1] : a[i+1];
              absCmds.push({ type: 'Q', args: [qcx, qcy, cx, cy] });
              lastControl = [qcx, qcy];
            }
          } else if (typeUpper === 'C') {
            for (let i = 0; i < a.length; i += 6) {
              let c1x = isRel ? cx + a[i] : a[i];
              let c1y = isRel ? cy + a[i+1] : a[i+1];
              let c2x = isRel ? cx + a[i+2] : a[i+2];
              let c2y = isRel ? cy + a[i+3] : a[i+3];
              cx = isRel ? cx + a[i+4] : a[i+4];
              cy = isRel ? cy + a[i+5] : a[i+5];
              absCmds.push({ type: 'C', args: [c1x, c1y, c2x, c2y, cx, cy] });
              lastControl = [c2x, c2y];
            }
          } else if (typeUpper === 'S') {
            for (let i = 0; i < a.length; i += 4) {
              let c1x = lastControl ? (2 * cx - lastControl[0]) : cx;
              let c1y = lastControl ? (2 * cy - lastControl[1]) : cy;
              let c2x = isRel ? cx + a[i] : a[i];
              let c2y = isRel ? cy + a[i+1] : a[i+1];
              cx = isRel ? cx + a[i+2] : a[i+2];
              cy = isRel ? cy + a[i+3] : a[i+3];
              absCmds.push({ type: 'C', args: [c1x, c1y, c2x, c2y, cx, cy] });
              lastControl = [c2x, c2y];
            }
          } else if (typeUpper === 'A') {
            for (let i = 0; i < a.length; i += 7) {
              let rx = a[i], ry = a[i+1], rot = a[i+2], large = a[i+3], sweep = a[i+4];
              cx = isRel ? cx + a[i+5] : a[i+5];
              cy = isRel ? cy + a[i+6] : a[i+6];
              absCmds.push({ type: 'A', args: [rx, ry, rot, large, sweep, cx, cy] });
              lastControl = null;
            }
          } else if (typeUpper === 'Z') {
            cx = startX; cy = startY;
            absCmds.push({ type: 'L', args: [cx, cy] });
            lastControl = null;
          }
        });

        return absCmds;
      }
      function stringifyPathCommands(cmds) {
        return cmds.map((c) => c.type + ' ' + c.args.map(round).join(' ')).join(' ').trim();
      }
      function isPathStraight(pathEl) {
        const cmds = parsePathCommands(pathEl.getAttribute('d'));
        return !cmds.some((c) => 'QqCcAa'.includes(c.type));
      }
      function reversePathCommands(cmds) {
        if (!cmds || cmds.length < 2) return cmds;

        const segments = [];
        let pen = [cmds[0].args[0], cmds[0].args[1]];

        for (let i = 1; i < cmds.length; i++) {
          const c = cmds[i];
          const start = [...pen];
          let end = [];

          if (c.type === 'L') {
            end = [c.args[0], c.args[1]];
            segments.push({ type: 'L', start, end });
          } else if (c.type === 'Q') {
            end = [c.args[2], c.args[3]];
            segments.push({ type: 'Q', ctrl: [c.args[0], c.args[1]], start, end });
          } else if (c.type === 'C') {
            end = [c.args[4], c.args[5]];
            segments.push({ type: 'C', c1: [c.args[0], c.args[1]], c2: [c.args[2], c.args[3]], start, end });
          } else if (c.type === 'A') {
            end = [c.args[5], c.args[6]];
            segments.push({ type: 'A', rx: c.args[0], ry: c.args[1], rot: c.args[2], large: c.args[3], sweep: c.args[4] === 1 ? 0 : 1, start, end });
          }
          pen = end;
        }

        if (segments.length === 0) return cmds;

        const reversed = [];
        const lastEnd = segments[segments.length - 1].end;
        reversed.push({ type: 'M', args: [lastEnd[0], lastEnd[1]] });

        for (let i = segments.length - 1; i >= 0; i--) {
          const seg = segments[i];
          if (seg.type === 'L') {
            reversed.push({ type: 'L', args: [seg.start[0], seg.start[1]] });
          } else if (seg.type === 'Q') {
            reversed.push({ type: 'Q', args: [seg.ctrl[0], seg.ctrl[1], seg.start[0], seg.start[1]] });
          } else if (seg.type === 'C') {
            reversed.push({ type: 'C', args: [seg.c2[0], seg.c2[1], seg.c1[0], seg.c1[1], seg.start[0], seg.start[1]] });
          } else if (seg.type === 'A') {
            reversed.push({ type: 'A', args: [seg.rx, seg.ry, seg.rot, seg.large, seg.sweep, seg.start[0], seg.start[1]] });
          }
        }

        return reversed;
      }

      function populateMarkerDropdowns(svg) {
        const startSelect = $('markerStart');
        const endSelect = $('markerEnd');
        if (!startSelect || !endSelect || !svg) return;

        startSelect.innerHTML = '<option value="none">None</option>';
        endSelect.innerHTML = '<option value="none">None</option>';

        const markers = svg.querySelectorAll('defs marker');
        markers.forEach((m) => {
          const id = m.getAttribute('id');
          if (!id) return;

          const label = id.replace(/^ed-/, '').replace(/-/g, ' ');
          const capitalized = label.charAt(0).toUpperCase() + label.slice(1);

          const optStart = document.createElement('option');
          optStart.value = 'url(#' + id + ')';
          optStart.textContent = capitalized;
          startSelect.appendChild(optStart);

          const optEnd = document.createElement('option');
          optEnd.value = 'url(#' + id + ')';
          optEnd.textContent = capitalized;
          endSelect.appendChild(optEnd);
        });
      }

      // ============================================================
      // Overlay: draggable handles for the selected line/path
      // ============================================================
      function removeOverlay() {
        if (overlayGroup) { overlayGroup.remove(); overlayGroup = null; }
      }

      function makeHandle(x, y, cls, onMove) {
        const g = document.createElementNS(SVG_NS, 'g');
        const c = document.createElementNS(SVG_NS, 'circle');
        c.setAttribute('cx', x);
        c.setAttribute('cy', y);
        c.setAttribute('r', 5.5);
        c.setAttribute('class', 'handle handle-' + cls);
        c.addEventListener('pointerdown', (e) => {
          e.stopPropagation(); // Prevents line drag from triggering when clicking handles
          e.preventDefault();
          const svg = activeSvg;
          function move(ev) {
            const p = svgPoint(ev, svg);
            const nx = Math.round(p.x), ny = Math.round(p.y);
            c.setAttribute('cx', nx);
            c.setAttribute('cy', ny);
            onMove(nx, ny);
          }
          function up() {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            window.removeEventListener('pointercancel', up);
            snapshot();
          }
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
          window.addEventListener('pointercancel', up);
        });
        g.appendChild(c);
        return g;
      }
      function makeGuide(x1, y1, x2, y2) {
        const l = document.createElementNS(SVG_NS, 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y1);
        l.setAttribute('x2', x2); l.setAttribute('y2', y2);
        l.setAttribute('class', 'guide');
        return l;
      }

      function commitPathD(cmds) {
        const d = stringifyPathCommands(cmds);
        selection.el.setAttribute('d', d);
        const hit = hitMap.get(selection.el);
        if (hit) hit.setAttribute('d', d);
        renderOverlay();
        fillFields();
      }

      function renderOverlay() {
        removeOverlay();
        if (!selection || !activeSvg) return;

        if (selection.type === 'line') {
          overlayGroup = document.createElementNS(SVG_NS, 'g');
          overlayGroup.setAttribute('class', 'editor-overlay');
          const el = selection.el;
          const x1 = numAttr(el, 'x1'), y1 = numAttr(el, 'y1');
          const x2 = numAttr(el, 'x2'), y2 = numAttr(el, 'y2');
          overlayGroup.appendChild(makeHandle(x1, y1, 'start', (nx, ny) => {
            el.setAttribute('x1', nx); el.setAttribute('y1', ny);
            const hit = hitMap.get(el); if (hit) syncHitGeometry(el, hit);
          }));
          overlayGroup.appendChild(makeHandle(x2, y2, 'end', (nx, ny) => {
            el.setAttribute('x2', nx); el.setAttribute('y2', ny);
            const hit = hitMap.get(el); if (hit) syncHitGeometry(el, hit);
          }));
          // activeSvg.appendChild(overlayGroup);
          // selection.el.parentNode.appendChild(overlayGroup);
          (selection.el.parentNode || activeSvg).appendChild(overlayGroup);
        } else if (selection.type === 'path') {
          overlayGroup = document.createElementNS(SVG_NS, 'g');
          overlayGroup.setAttribute('class', 'editor-overlay');
          const el = selection.el;
          const cmds = parsePathCommands(el.getAttribute('d'));
          let pen = [0, 0];
          cmds.forEach((cmd, idx) => {
            const t = cmd.type, a = cmd.args;
            if (t === 'M' || t === 'L' || t === 'm' || t === 'l') {
              overlayGroup.appendChild(makeHandle(a[0], a[1], 'anchor', (nx, ny) => {
                const dx = nx - a[0];
                const dy = ny - a[1];
                a[0] = nx; a[1] = ny;
                if (cmds[idx + 1]) {
                  const next = cmds[idx + 1];
                  const nt = next.type;
                  if (nt === 'C' || nt === 'c' || nt === 'Q' || nt === 'q') {
                    next.args[0] += dx;
                    next.args[1] += dy;
                  }
                }
                commitPathD(cmds);
              }));
              pen = [a[0], a[1]];
            } else if (t === 'Q' || t === 'q') {
              overlayGroup.appendChild(makeGuide(pen[0], pen[1], a[0], a[1]));
              overlayGroup.appendChild(makeGuide(a[0], a[1], a[2], a[3]));
              overlayGroup.appendChild(makeHandle(a[0], a[1], 'ctrl', (nx, ny) => { a[0] = nx; a[1] = ny; commitPathD(cmds); }));
              overlayGroup.appendChild(makeHandle(a[2], a[3], 'anchor', (nx, ny) => {
                const dx = nx - a[2];
                const dy = ny - a[3];
                a[2] = nx; a[3] = ny;
                a[0] += dx; a[1] += dy;
                if (cmds[idx + 1]) {
                  const next = cmds[idx + 1];
                  const nt = next.type;
                  if (nt === 'C' || nt === 'c' || nt === 'Q' || nt === 'q') {
                    next.args[0] += dx;
                    next.args[1] += dy;
                  }
                }
                commitPathD(cmds);
              }));
              pen = [a[2], a[3]];
            } else if (t === 'C' || t === 'c') {
              overlayGroup.appendChild(makeGuide(pen[0], pen[1], a[0], a[1]));
              overlayGroup.appendChild(makeGuide(a[2], a[3], a[4], a[5]));
              overlayGroup.appendChild(makeHandle(a[0], a[1], 'ctrl', (nx, ny) => { a[0] = nx; a[1] = ny; commitPathD(cmds); }));
              overlayGroup.appendChild(makeHandle(a[2], a[3], 'ctrl2', (nx, ny) => { a[2] = nx; a[3] = ny; commitPathD(cmds); }));
              overlayGroup.appendChild(makeHandle(a[4], a[5], 'anchor', (nx, ny) => {
                const dx = nx - a[4];
                const dy = ny - a[5];
                a[4] = nx; a[5] = ny;
                a[2] += dx; a[3] += dy;
                if (cmds[idx + 1]) {
                  const next = cmds[idx + 1];
                  const nt = next.type;
                  if (nt === 'C' || nt === 'c' || nt === 'Q' || nt === 'q') {
                    next.args[0] += dx;
                    next.args[1] += dy;
                  }
                }
                commitPathD(cmds);
              }));
              pen = [a[4], a[5]];
            } else if (t === 'A' || t === 'a') {
              const ex = a[5], ey = a[6];
              overlayGroup.appendChild(makeHandle(ex, ey, 'anchor', (nx, ny) => {
                const dx = nx - ex;
                const dy = ny - ey;
                a[5] = nx; a[6] = ny;
                if (cmds[idx + 1]) {
                  const next = cmds[idx + 1];
                  const nt = next.type;
                  if (nt === 'C' || nt === 'c' || nt === 'Q' || nt === 'q') {
                    next.args[0] += dx;
                    next.args[1] += dy;
                  }
                }
                commitPathD(cmds);
              }));
              pen = [ex, ey];
            }
          });
          // activeSvg.appendChild(overlayGroup);
          (selection.el.parentNode || activeSvg).appendChild(overlayGroup);
        }
      }

      // ============================================================
      // Edge actions: convert straight/curved, reverse direction
      // ============================================================
      function convertEdge() {
        if (!selection) return;
        const svg = activeSvg;

        if (selection.type === 'line') {
          const el = selection.el;
          const x1 = numAttr(el, 'x1'), y1 = numAttr(el, 'y1');
          const x2 = numAttr(el, 'x2'), y2 = numAttr(el, 'y2');
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
          const cx = Math.round(mx - dy * 0.25), cy = Math.round(my + dx * 0.25);

          const path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2);
          ['stroke', 'stroke-width', 'stroke-dasharray', 'marker-start', 'marker-end'].forEach((a) => {
            if (el.hasAttribute(a)) path.setAttribute(a, el.getAttribute(a));
          });
          path.setAttribute('fill', 'none');
          path.classList.add('editable');

          const oldHit = hitMap.get(el);
          if (oldHit) oldHit.remove();
          el.replaceWith(path);

          const newHit = makeHitTwin(path);
          path.parentNode.insertBefore(newHit, path);
          hitMap.set(path, newHit);
          const onDown = (e) => onEdgeDown(e, path, svg);
          newHit.addEventListener('pointerdown', onDown);
          path.addEventListener('pointerdown', onDown);

          setSelection('path', path);
          snapshot();
          toast('Converted to a curved path');
        } else if (selection.type === 'path') {
          const el = selection.el;
          const straight = isPathStraight(el);
          const cmds = parsePathCommands(el.getAttribute('d'));
          if (cmds.length < 2) return;
          const first = cmds[0].args;
          const lastArgs = cmds[cmds.length - 1].args;
          const x1 = first[0], y1 = first[1];
          const x2 = lastArgs[lastArgs.length - 2], y2 = lastArgs[lastArgs.length - 1];

          if (straight) {
            const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
            const cx = Math.round(mx - dy * 0.25), cy = Math.round(my + dx * 0.25);
            el.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' Q ' + cx + ' ' + cy + ' ' + x2 + ' ' + y2);
          } else {
            el.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2);
          }
          const hit = hitMap.get(el);
          if (hit) hit.setAttribute('d', el.getAttribute('d'));
          renderOverlay();
          fillFields();
          snapshot();
          toast(straight ? 'Converted to a curved path' : 'Converted to a straight path');
        }
      }

      function flipDirection() {
        if (!selection) return;
        const el = selection.el;

        if (selection.type === 'line') {
          const x1 = el.getAttribute('x1'), y1 = el.getAttribute('y1');
          const x2 = el.getAttribute('x2'), y2 = el.getAttribute('y2');
          el.setAttribute('x1', x2); el.setAttribute('y1', y2);
          el.setAttribute('x2', x1); el.setAttribute('y2', y1);
          const hit = hitMap.get(el); if (hit) syncHitGeometry(el, hit);
        } else if (selection.type === 'path') {
          const cmds = parsePathCommands(el.getAttribute('d'));
          const d = stringifyPathCommands(reversePathCommands(cmds));
          el.setAttribute('d', d);
          const hit = hitMap.get(el); if (hit) hit.setAttribute('d', d);
        }
        renderOverlay();
        fillFields();
        snapshot();
        toast('Direction reversed');
      }

      // ============================================================
      // Delete
      // ============================================================
      function deleteSelected() {
        if (!selection) return;
        if (selection.type === 'node') {
          selection.el.remove();
          if (selection.textEl) selection.textEl.remove();
        } else if (selection.type === 'line' || selection.type === 'path') {
          const hit = hitMap.get(selection.el);
          if (hit) hit.remove();
          selection.el.remove();
        } else {
          selection.el.remove();
        }
        clearSelection();
        snapshot();
        toast('Element deleted');
      }

      // ============================================================
      // Field event wiring
      // ============================================================
      function wireFields() {
        buildSwatches();

        $('fillPicker').addEventListener('input', (e) => applyColor('fill', e.target.value));
        $('fillHex').addEventListener('change', (e) => applyColor('fill', e.target.value.trim()));
        $('strokePicker').addEventListener('input', (e) => applyColor('stroke', e.target.value));
        $('strokeHex').addEventListener('change', (e) => applyColor('stroke', e.target.value.trim()));

        $('strokeWidthRange').addEventListener('input', (e) => {
          if (!selection) return;
          selection.el.setAttribute('stroke-width', e.target.value);
          $('strokeWidthReadout').textContent = parseFloat(e.target.value).toFixed(1);
        });
        $('strokeWidthRange').addEventListener('change', snapshot);

        $('textContent').addEventListener('input', (e) => { if (selection) selection.el.textContent = e.target.value; });
        $('textContent').addEventListener('change', snapshot);
        $('textX').addEventListener('change', () => change(() => selection.el.setAttribute('x', numVal('textX'))));
        $('textY').addEventListener('change', () => change(() => selection.el.setAttribute('y', numVal('textY'))));
        $('textSize').addEventListener('change', () => change(() => selection.el.setAttribute('font-size', numVal('textSize'))));
        $('textAnchor').addEventListener('change', (e) => change(() => selection.el.setAttribute('text-anchor', e.target.value)));

        $('nodeLabel').addEventListener('input', (e) => { if (selection && selection.textEl) selection.textEl.textContent = e.target.value; });
        $('nodeLabel').addEventListener('change', snapshot);
        $('nodeCx').addEventListener('change', () => change(() => {
          const v = numVal('nodeCx');
          selection.el.setAttribute('cx', v);
          if (selection.textEl) selection.textEl.setAttribute('x', v);
        }));
        $('nodeCy').addEventListener('change', () => change(() => {
          const v = numVal('nodeCy');
          selection.el.setAttribute('cy', v);
          if (selection.textEl) selection.textEl.setAttribute('y', v);
        }));

        ['rectX', 'rectY', 'rectW', 'rectH'].forEach((id) => {
          const attr = { rectX: 'x', rectY: 'y', rectW: 'width', rectH: 'height' }[id];
          $(id).addEventListener('change', () => change(() => selection.el.setAttribute(attr, numVal(id))));
        });

        $('markerStart').addEventListener('change', (e) => change(() => {
          const v = e.target.value;
          if (v === 'none') selection.el.removeAttribute('marker-start');
          else selection.el.setAttribute('marker-start', v);
        }));

        $('markerEnd').addEventListener('change', (e) => change(() => {
          const v = e.target.value;
          if (v === 'none') selection.el.removeAttribute('marker-end');
          else selection.el.setAttribute('marker-end', v);
        }));

        $('btnFlip').addEventListener('click', flipDirection);
        $('btnConvert').addEventListener('click', convertEdge);
        $('delete').addEventListener('click', deleteSelected);
      }

      // ============================================================
      // Zoom
      // ============================================================
      function setZoom() {
        canvas.style.transform = 'scale(' + zoom + ')';
        $('zoomReadout').textContent = Math.round(zoom * 100) + '%';
      }
      function wireZoom() {
        $('zoomIn').addEventListener('click', () => { zoom = Math.min(2.5, round(zoom + 0.15)); setZoom(); });
        $('zoomOut').addEventListener('click', () => { zoom = Math.max(0.4, round(zoom - 0.15)); setZoom(); });
        $('zoomReset').addEventListener('click', () => { zoom = 1; setZoom(); });
      }

      // ============================================================
      // Import / Copy
      // ============================================================
      function openImport() {
        $('importArea').value = clean();
        $('importModal').hidden = false;
        $('importArea').focus();
      }
      function closeImport() { $('importModal').hidden = true; }

      function copyToClipboard(text, msg) {
        // 1. Check for Anki's Python Bridge
        if (typeof pycmd !== 'undefined') {
          pycmd('copy_to_clipboard:' + encodeURIComponent(text));
          toast(msg);
          return;
        }

        // 2. Web API for secure web contexts
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(() => toast(msg))
            .catch(() => fallbackCopy(text, msg));
          return;
        }

        // 3. Fallback for standalone legacy web contexts
        fallbackCopy(text, msg);
      }
      function fallbackCopy(text, msg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          toast(msg);
        } catch (err) {
          toast('Copy failed', 'error');
        }
        document.body.removeChild(ta);
      }

      function wireToolbar() {
        $('undo').addEventListener('click', () => restore(histIndex - 1));
        $('redo').addEventListener('click', () => restore(histIndex + 1));

        $('btnImport').addEventListener('click', openImport);
        $('importClose').addEventListener('click', closeImport);
        $('importCancel').addEventListener('click', closeImport);
        $('importModal').addEventListener('pointerdown', (e) => { if (e.target === $('importModal')) closeImport(); });
        $('importApply').addEventListener('click', () => {
          const code = $('importArea').value.trim();
          if (!code) return;
          clearSelection();
          zoom = 1; setZoom();
          renderHtml(code);
          closeImport();
          toast('Code imported');
        });

        $('btnCopy').addEventListener('click', () => copyToClipboard(clean(), 'Code copied to clipboard'));
      }

      // ============================================================
      // Keyboard shortcuts
      // ============================================================
      window.addEventListener('keydown', (e) => {
        const tag = document.activeElement ? document.activeElement.tagName : '';
        const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          restore(histIndex - (e.shiftKey ? -1 : 1));
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          restore(histIndex + 1);
        } else if ((e.key === 'Delete' || e.key === 'Backspace') && selection && !typing) {
          e.preventDefault();
          deleteSelected();
        } else if (e.key === 'Escape') {
          if (!$('importModal').hidden) closeImport();
          else clearSelection();
        }
      });

      // ============================================================
      // Theme hook for the Anki add-on host
      // Call window.setEditorTheme('dark' | 'light' | 'auto') from the
      // Python side (via webview.eval) to force a theme that matches
      // Anki's actual night-mode setting. 'auto' falls back to the
      // browser's prefers-color-scheme.
      // ============================================================
      window.setEditorTheme = function (mode) {
        if (mode === 'dark' || mode === 'light') {
          document.documentElement.setAttribute('data-theme', mode);
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      };

      // Auto-detect Anki night mode classes if present on initial load
      if (document.documentElement.classList.contains('night_mode') ||
        document.documentElement.classList.contains('nightMode') ||
        document.body.classList.contains('night_mode') ||
        document.body.classList.contains('nightMode')) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      // ============================================================
      // Public contract used by the Anki add-on to read back the result
      // ============================================================
      window.getEditedHtml = clean;

      // ============================================================
      // Init
      // ============================================================
      wireFields();
      wireZoom();
      wireToolbar();
      renderHtml(initialHtml);
    })();
  </script>
</body>

</html>
